# /etc/nginx/sites-available/businessrun
#
# SETUP:
#   sudo cp nginx-businessrun.conf /etc/nginx/sites-available/businessrun
#   sudo ln -s /etc/nginx/sites-available/businessrun /etc/nginx/sites-enabled/businessrun
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (run after DNS is pointed at the server):
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d thebusinessrun.com -d www.thebusinessrun.com

server {
    listen 80;
    server_name www.thebusinessrun.com;
    return 301 http://thebusinessrun.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name thebusinessrun.com;

    root  /var/www/businessrun/build;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy → Express (uncomment when backend is ready)
    # location /api/ {
    #     proxy_pass         http://localhost:5000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # }

    # React Router — serve index.html for all non-file URLs
    location / {
        try_files $uri $uri/ /index.html;
    }
}
