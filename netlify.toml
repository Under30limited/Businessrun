# ================================================================
# Netlify Configuration — BusinessRun
# ================================================================

[build]
  # Where your React source lives
  base = "."

  # Command Netlify runs to build the app
  command = "npm run build"

  # Folder Netlify deploys (React outputs here)
  publish = "build"

  # Netlify Functions folder
  functions = "netlify/functions"

# ── SPA routing fix ───────────────────────────────────────────────
# Sends all routes to index.html so React Router handles them.
# Without this, refreshing any page gives a 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Environment variables ─────────────────────────────────────────
# Do NOT put your actual key here — this file goes to GitHub.
# Add GEMINI_API_KEY in Netlify dashboard:
#   Site settings → Environment variables → Add variable
#     Key:   GEMINI_API_KEY
#     Value: your AIza... key
